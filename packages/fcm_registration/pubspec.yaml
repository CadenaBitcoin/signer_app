name: fcm_registration
description: Registration-only bridge to native Firebase Messaging FID APIs.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.cadena.fcm_registration
        pluginClass: FcmRegistrationPlugin
      ios:
        pluginClass: FcmRegistrationPlugin
