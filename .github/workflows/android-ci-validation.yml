# Android CI validation build.
#
# Builds a DEBUG APK from the exact commit pushed to `staging` and uploads it as
# a GitHub Actions artifact. This is an infrastructure/CI validation artifact:
#   - it is NOT approved for public distribution;
#   - it is debug-signed with an ephemeral runner key (no signing secrets);
#   - its environment is selected EXPLICITLY by BUILD_CONFIG_FILE below
#     (config/build/staging.json), never by the branch name; a missing, incomplete
#     or contradictory configuration fails the build (lib/config/build_config.dart);
#   - it is the `staging` flavor (--flavor staging): the separate staging application
#     com.app.cadenabitcoin.staging. The flavor selects only the application identity and
#     must agree with the configuration, otherwise the build fails;
#   - it uses the committed prebuilt Rust binaries (no native rebuild).
# See docs/ANDROID_CI.md.

name: Android CI validation build

on:
  push:
    branches: [staging]
  # Manual dry run of the same build for any ref, without promoting to staging.
  # GitHub only offers this once the workflow file exists on the default branch.
  workflow_dispatch:

# Least privilege: the job only reads the repository. No release, no write access.
permissions:
  contents: read

env:
  # The environment this workflow builds. Passed to Flutter with
  # --dart-define-from-file and checked against what the app itself resolves.
  BUILD_CONFIG_FILE: config/build/staging.json
  # The Android flavor (application identity). Must equal the APP_ENV of the file above.
  BUILD_FLAVOR: staging

jobs:
  android-ci-validation:
    name: Build debug APK (CI validation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Resolve dependencies
        run: |
          flutter pub get --enforce-lockfile
          (cd flutter_plugin/flutter_plugin && flutter pub get)

      # Compiles tool/build_config_probe.dart against BuildConfig for every valid
      # and invalid configuration (valid ones must resolve to the intended
      # values, invalid ones must be rejected), including release/AOT compiles,
      # the analyzer guard and the portability scan, then records what the app
      # itself resolves from this workflow's configuration and requires it to
      # be staging.
      - name: Verify build configuration
        run: |
          tool/verify_build_config.sh verify
          resolved="$(tool/verify_build_config.sh resolve "$BUILD_CONFIG_FILE" "$BUILD_FLAVOR")"
          echo "Resolved from $BUILD_CONFIG_FILE with --flavor $BUILD_FLAVOR:"
          echo "$resolved"
          if ! grep -qx 'APP_ENV=staging' <<<"$resolved"; then
            echo "::error::$BUILD_CONFIG_FILE does not resolve to APP_ENV=staging; refusing to build a staging CI artifact from it."
            exit 1
          fi
          echo "$resolved" > "$RUNNER_TEMP/resolved-build-config.txt"

      # The accepted analyzer baseline is 0 errors; existing warnings/info are
      # known technical debt (CLAUDE.md section 4). Only errors fail this step.
      # There is no test/ directory on this branch, so no `flutter test` step.
      - name: Analyze (errors fail; pre-existing warnings/info do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug --flavor "$BUILD_FLAVOR" --dart-define-from-file="$BUILD_CONFIG_FILE"

      # Reads the identity, version and signer from the APK itself (aapt2, apksigner). A
      # debug build embeds both backend URLs, so no environment check from the binary is
      # possible here; the verified resolved configuration plus the build command stand in.
      - name: Verify the built APK (application ID, name, version, signing)
        run: |
          apk="build/app/outputs/flutter-apk/app-${BUILD_FLAVOR}-debug.apk"
          tool/verify_artifact.sh apk "$BUILD_FLAVOR" "$apk" --signing debug --debug-build --evidence "$RUNNER_TEMP/apk-evidence.txt"

      - name: Prepare labelled artifact
        id: prep
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z.+-]+$'; then
            echo "::error::Could not read a valid version from pubspec.yaml (got '$version')"
            exit 1
          fi

          # What the app's own BuildConfig resolved from $BUILD_CONFIG_FILE
          # (recorded by "Verify build configuration" with the same defines).
          resolved_file="$RUNNER_TEMP/resolved-build-config.txt"
          resolved() { sed -n "s/^$1=//p" "$resolved_file" | head -n1; }
          app_env="$(resolved APP_ENV)"
          network="$(resolved NETWORK_ENVIRONMENT)"
          use_testnet="$(resolved USE_TESTNET)"
          api_base_url="$(resolved API_BASE_URL)"

          case "$app_env" in
            staging)
              env_verdict="STAGING backend configuration (Signet)"
              annotation="notice"
              ;;
            production)
              env_verdict="PRODUCTION BACKEND CONFIGURATION"
              annotation="warning"
              ;;
            *)
              echo "::error::Unexpected resolved APP_ENV '$app_env'"
              exit 1
              ;;
          esac

          evidence() { sed -n "s/^$1=//p" "$RUNNER_TEMP/apk-evidence.txt" | head -n1; }
          application_id="$(evidence application_id)"
          display_name="$(evidence display_name)"

          short_sha="${GITHUB_SHA::7}"
          name="CI-VALIDATION-NOT-APPROVED-FOR-PUBLIC-DISTRIBUTION_cadena-signer_v${version}_${app_env}_${short_sha}_run${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p ci-artifact
          apk="ci-artifact/${name}_debug.apk"
          cp "build/app/outputs/flutter-apk/app-${BUILD_FLAVOR}-debug.apk" "$apk"
          apk_sha256="$(sha256sum "$apk" | cut -d' ' -f1)"

          notice="ci-artifact/CI-VALIDATION-NOTICE.txt"
          {
            echo "CI VALIDATION — NOT APPROVED FOR PUBLIC DISTRIBUTION"
            echo
            echo "Environment : ${app_env}  -> ${env_verdict}"
            echo "  USE_TESTNET         = ${use_testnet}"
            echo "  NETWORK_ENVIRONMENT = ${network}"
            echo "  API_BASE_URL        = ${api_base_url}"
            echo "  Selected explicitly by: --dart-define-from-file=${BUILD_CONFIG_FILE}"
            echo "  (not by the branch name; validated at compile time by lib/config/build_config.dart)"
            echo
            echo "Application : ${application_id} ('${display_name}'), flavor ${BUILD_FLAVOR} (read from the APK by tool/verify_artifact.sh)"
            echo
            echo "Compile-time validated only: CI has not exercised this APK against the backend."
            echo "Debug-signed with an ephemeral CI key. Not a release. Not for distribution."
            echo "Uses the committed prebuilt Rust binaries (no native rebuild)."
            echo
            echo "App version : ${version} (unchanged from pubspec.yaml)"
            echo "Commit SHA  : ${GITHUB_SHA}"
            echo "Ref         : ${GITHUB_REF_NAME}"
            echo "Run         : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "APK SHA-256 : ${apk_sha256}"
          } > "$notice"

          {
            echo "## CI VALIDATION — NOT APPROVED FOR PUBLIC DISTRIBUTION"
            echo
            if [ "$app_env" = "production" ]; then
              echo "> **WARNING: this build contains ${env_verdict}.**"
            else
              echo "> **Environment: ${env_verdict}.** Selected explicitly by \`${BUILD_CONFIG_FILE}\`, not by the branch name. Compile-time validated only; still a CI validation artifact."
            fi
            echo "> \`API_BASE_URL = ${api_base_url}\`, \`NETWORK_ENVIRONMENT = ${network}\`, \`USE_TESTNET = ${use_testnet}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${app_env}\` |"
            echo "| Config file | \`${BUILD_CONFIG_FILE}\` |"
            echo "| Application ID | \`${application_id}\` ('${display_name}') |"
            echo "| App version | \`${version}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Run | #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT}) |"
            echo "| Signing | debug key, ephemeral, no secrets |"
            echo "| Artifact | \`${name}\` |"
            echo "| APK SHA-256 | \`${apk_sha256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::${annotation} title=CI VALIDATION - NOT FOR DISTRIBUTION::${env_verdict} (API_BASE_URL=${api_base_url}). Selected by ${BUILD_CONFIG_FILE}."

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prep.outputs.name }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14
