# Android CI validation build.
#
# Builds a DEBUG APK from the exact commit pushed to `staging` and uploads it as
# a GitHub Actions artifact. This is an infrastructure/CI validation artifact:
#   - it is NOT approved for public distribution;
#   - it is debug-signed with an ephemeral runner key (no signing secrets);
#   - it currently contains the environment constants committed in
#     lib/src/ui/controllers/appController.dart (today: PRODUCTION backend);
#   - it uses the committed prebuilt Rust binaries (no native rebuild).
# See docs/ANDROID_CI.md.

name: Android CI validation build

on:
  push:
    branches: [staging]
  # Manual dry run of the same build for any ref, without promoting to staging.
  # GitHub only offers this once the workflow file exists on the default branch.
  workflow_dispatch:

# Least privilege: the job only reads the repository. No release, no write access.
permissions:
  contents: read

jobs:
  android-ci-validation:
    name: Build debug APK (CI validation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Resolve dependencies
        run: |
          flutter pub get --enforce-lockfile
          (cd flutter_plugin/flutter_plugin && flutter pub get)

      # The accepted analyzer baseline is 0 errors; existing warnings/info are
      # known technical debt (CLAUDE.md section 4). Only errors fail this step.
      # There is no test/ directory on this branch, so no `flutter test` step.
      - name: Analyze (errors fail; pre-existing warnings/info do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare labelled artifact
        id: prep
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z.+-]+$'; then
            echo "::error::Could not read a valid version from pubspec.yaml (got '$version')"
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          name="CI-VALIDATION-NOT-APPROVED-FOR-PUBLIC-DISTRIBUTION_cadena-signer_v${version}_${short_sha}_run${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          # Report the environment constants actually compiled into this commit.
          const() {
            sed -nE "s/^[[:space:]]*static const [A-Za-z]+ $1 = ([^;]*);.*/\1/p" \
              lib/src/ui/controllers/appController.dart | head -n1
          }
          use_testnet="$(const USE_TESTNET)"
          network="$(const NETWORK_ENVIRONMENT)"
          api_base_url="$(const API_BASE_URL)"

          if printf '%s' "$api_base_url" | grep -q 'cadenabitcoin\.com'; then
            env_verdict="PRODUCTION BACKEND CONFIGURATION"
          else
            env_verdict="non-production-looking configuration - verify before use"
          fi

          mkdir -p ci-artifact
          apk="ci-artifact/${name}_debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$apk"
          apk_sha256="$(sha256sum "$apk" | cut -d' ' -f1)"

          notice="ci-artifact/CI-VALIDATION-NOTICE.txt"
          {
            echo "CI VALIDATION — NOT APPROVED FOR PUBLIC DISTRIBUTION"
            echo
            echo "WARNING: this build contains: ${env_verdict}"
            echo "  USE_TESTNET         = ${use_testnet}"
            echo "  NETWORK_ENVIRONMENT = ${network}"
            echo "  API_BASE_URL        = ${api_base_url}"
            echo "  (values read from lib/src/ui/controllers/appController.dart at this commit)"
            echo
            echo "Debug-signed with an ephemeral CI key. Not a release. Not for distribution."
            echo "Uses the committed prebuilt Rust binaries (no native rebuild)."
            echo
            echo "App version : ${version} (unchanged from pubspec.yaml)"
            echo "Commit SHA  : ${GITHUB_SHA}"
            echo "Ref         : ${GITHUB_REF_NAME}"
            echo "Run         : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "APK SHA-256 : ${apk_sha256}"
          } > "$notice"

          {
            echo "## CI VALIDATION — NOT APPROVED FOR PUBLIC DISTRIBUTION"
            echo
            echo "> **WARNING: this build contains ${env_verdict}.**"
            echo "> \`API_BASE_URL = ${api_base_url}\`, \`NETWORK_ENVIRONMENT = ${network}\`, \`USE_TESTNET = ${use_testnet}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| App version | \`${version}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Run | #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT}) |"
            echo "| Signing | debug key, ephemeral, no secrets |"
            echo "| Artifact | \`${name}\` |"
            echo "| APK SHA-256 | \`${apk_sha256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=CI VALIDATION - NOT FOR DISTRIBUTION::This APK contains ${env_verdict} (API_BASE_URL=${api_base_url})."

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prep.outputs.name }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14
