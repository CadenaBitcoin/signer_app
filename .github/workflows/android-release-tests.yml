# Android release tests: credential-free, on pull requests (Issue #72).
#
# Runs the tests of the Android application identity, the release-signing rules and the release
# verifier on every pull request that targets an integration or release branch, so a change to
# any of them is tested before it is reviewed and merged.
#
# What this is NOT:
#   - It builds no application, signs nothing and uploads nothing: no APK, no AAB, no artifact.
#   - It holds no signing credential and reads no secret. The only key involved is a DISPOSABLE
#     keystore that a test creates in a temporary directory of the runner and deletes again.
#   - It is not a release or promotion workflow. Those (build-variants.yml) keep their established
#     triggers - a push to `staging` or `production` and a manual run - and never start from a pull
#     request (docs/RELEASE_TRIGGERS.md). This workflow only tests, with `pull_request` (never
#     `pull_request_target`, so code of a fork cannot reach a secret, and there is none).
#
# No path filter: the jobs take seconds to a few minutes, and a filter would leave a required check
# "skipped" on pull requests that touch other files. See docs/ANDROID_RELEASE.md section 7.

name: Android release tests (credential-free)

on:
  pull_request:
    branches: [development, staging, production]
  # Manual run for any ref (once this file is on the default branch).
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same pull request replaces the older run.
concurrency:
  group: android-release-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs only bash, git, python3 and the Android build tools that every runner has; no Flutter.
  hermetic:
    name: Release verifier, ledgers, identity and workflow rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test the Android release verification and the credential-free state of the workflows
        run: tool/test_android_release.sh

      - name: Verify the version and flavor wiring (application IDs, signing wiring)
        run: tool/verify_version.sh

      - name: Test the version policy, the identity matrix and the build manifests
        run: tool/test_release_versioning.sh

  # Real Gradle, dry runs only: nothing is compiled or signed.
  gradle-signing:
    name: Release signing rules (real Gradle, dry runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
          (cd flutter_plugin/flutter_plugin && flutter pub get)

      # The production signing identity signs the production application only; validation builds hold
      # no identity; every other fail-closed rule still holds. Each case is a Gradle --dry-run.
      - name: Test the release signing rules with a disposable keystore
        run: tool/test_android_gradle_signing.sh
